<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicago School Finder | Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Chicago School Finder</h1>
      <p>
        Review your starred schools. Favorites are stored locally in this browser (no
        login needed).
      </p>
      <nav>
        <a href="index.html">School List</a>
        <a href="map.html">Map View</a>
        <a class="active" href="favorites.html">Favorites</a>
      </nav>
    </header>

    <main>
      <div class="results-meta">
        <span id="results-count">0 schools</span>
        <span>Click a card to expand the full application checklist.</span>
      </div>
      <section id="cards" class="card-grid" aria-live="polite"></section>
      <div id="empty-state" class="empty-state" hidden>
        No favorites yet. Star a school on the list or map view to save it here.
      </div>
    </main>

    <script type="module" src="favorites.js"></script>
  </body>
</html>
