<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chicago School Finder | Map</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Chicago School Finder</h1>
      <p>
        Map view helps you visualize school clusters across neighborhoods while keeping
        the same filters from the list view.
      </p>
      <nav>
        <a href="index.html">School List</a>
        <a class="active" href="map.html">Map View</a>
        <a href="favorites.html">Favorites</a>
      </nav>
    </header>

    <main>
      <section class="filters">
        <h2>Filter schools</h2>
        <form id="filter-form">
          <div class="filter-grid">
            <label>
              Address (Chicago)
              <input
                type="text"
                name="address"
                placeholder="Enter your home address"
              />
            </label>
            <label>
              Max distance (miles)
              <select name="distance">
                <option value="">Any distance</option>
                <option value="2">2 miles</option>
                <option value="5">5 miles</option>
                <option value="8">8 miles</option>
                <option value="10">10 miles</option>
              </select>
            </label>
            <label>
              Minimum rating
              <select name="rating">
                <option value="">Any rating</option>
                <option value="7">7+</option>
                <option value="8">8+</option>
                <option value="9">9+</option>
              </select>
            </label>
            <label>
              Starting grade
              <select name="startGrade">
                <option value="">All</option>
                <option value="preK">Pre-K (age 4)</option>
                <option value="kPlus">Elementary (age 5+)</option>
              </select>
            </label>
            <label>
              Public or private
              <select name="publicType">
                <option value="">All</option>
                <option value="Public">Public</option>
                <option value="Private">Private</option>
              </select>
            </label>
            <label>
              Selective enrollment
              <select name="selective">
                <option value="">All</option>
                <option value="true">Selective</option>
                <option value="false">Open enrollment</option>
              </select>
            </label>
            <label>
              Apply by
              <input type="date" name="deadline" />
            </label>
          </div>
          <div class="filter-actions">
            <button class="primary" type="submit">Apply filters</button>
            <button class="ghost" type="button" id="reset-button">Reset</button>
          </div>
        </form>
      </section>

      <div class="results-meta">
        <span id="results-count">0 schools</span>
        <span>Markers are placeholders until a map API is connected.</span>
      </div>

      <section class="map-layout">
        <div class="map-panel">
          <strong>Chicago map preview</strong>
          <div id="map" class="map-canvas"></div>
        </div>
        <div>
          <section id="cards" class="card-grid" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <script type="module" src="map.js"></script>
  </body>
</html>
